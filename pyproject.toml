[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffquorum"
version = "0.2.0"
description = "Zero-dependency multi-agent session coordination (<400B pointer blackboard, 6-gate idle wakeup), blind anti-fake-quorum verifier & 0-token pitfall ratchet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ziqi" }]
keywords = ["ai-agents", "multi-agent", "tmux", "orchestration", "code-review", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ziqi/diffquorum"
Repository = "https://github.com/Ziqi/diffquorum"
Issues = "https://github.com/Ziqi/diffquorum/issues"
Security = "https://github.com/Ziqi/diffquorum/blob/main/SECURITY.md"
Changelog = "https://github.com/Ziqi/diffquorum/blob/main/CHANGELOG.md"

[project.scripts]
diffquorum = "diffquorum.cli:main"
dq = "diffquorum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
