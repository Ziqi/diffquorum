[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starcouncil"
version = "0.1.1"
description = "Zero-dependency Pointer-Over-Blackboard orchestration, anti-fake-council verifier, 6-gate idle wakeup, and tiered review toolkit for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ziqi" }]
keywords = ["ai-agents", "multi-agent", "tmux", "orchestration", "code-review", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ziqi/starcouncil"
Repository = "https://github.com/Ziqi/starcouncil"
Issues = "https://github.com/Ziqi/starcouncil/issues"
Security = "https://github.com/Ziqi/starcouncil/blob/main/SECURITY.md"
Changelog = "https://github.com/Ziqi/starcouncil/blob/main/CHANGELOG.md"

[project.scripts]
starcouncil = "starcouncil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
