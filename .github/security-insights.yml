header:
  schema-version: 2.0.0
  last-updated: '2026-11-16'
  last-reviewed: '2026-11-16'
  url: https://github.com/Ziqi/starcouncil
  project-sis-source: https://raw.githubusercontent.com/Ziqi/starcouncil/main/.github/security-insights.yml

project:
  name: starcouncil
  administrators:
    - name: Ziqi Xiao
      affiliation: Independent Maintainer
      social: https://github.com/Ziqi
      primary: true
  repositories:
    - name: starcouncil
      url: https://github.com/Ziqi/starcouncil
      comment: Pointer-Over-Blackboard orchestration, anti-fake-council verifier, 6-gate idle wakeup & tiered review microkernel
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    security-policy: https://github.com/Ziqi/starcouncil/blob/main/SECURITY.md
    contact:
      name: GitHub Private Security Advisories
      url: https://github.com/Ziqi/starcouncil/security/advisories/new

repository:
  url: https://github.com/Ziqi/starcouncil
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: Ziqi Xiao
      affiliation: Independent Maintainer
      social: https://github.com/Ziqi
      primary: true
  license:
    url: https://github.com/Ziqi/starcouncil/blob/main/LICENSE
    expression: MIT
  security:
    assessments:
      self:
        evidence: https://github.com/Ziqi/starcouncil/blob/main/SECURITY_ASSURANCE_CASE.md
        date: '2026-11-16'
        comment: Trust-boundary threat model, >=90% coverage gate, and 2,000-iteration security-invariant fuzzer.
    tools:
      - name: CodeQL
        type: SAST
        integration:
          ad-hoc: false
          ci: true
          before-release: true
        results:
          ad-hoc: false
          ci: true
          before-release: true
        comment: GitHub CodeQL v4 Python SAST on all pushes and pull requests.
      - name: StarCouncil Security-Invariant Fuzzer
        type: Fuzzer
        integration:
          ad-hoc: true
          ci: true
          before-release: true
        results:
          ad-hoc: true
          ci: true
          before-release: true
        comment: Dual-mode Google Atheris + 2,000-iteration stdlib property fuzzer (tests/fuzz_starcouncil.py).
      - name: OpenSSF Scorecard
        type: SCA
        integration:
          ad-hoc: true
          ci: true
          before-release: true
        results:
          ad-hoc: true
          ci: true
          before-release: true
        comment: Continuous supply-chain security audit (scorecard.dev).
  documentation:
    contributing-guide: https://github.com/Ziqi/starcouncil/blob/main/CONTRIBUTING.md
    governance: https://github.com/Ziqi/starcouncil/blob/main/GOVERNANCE.md
    security-policy: https://github.com/Ziqi/starcouncil/blob/main/SECURITY.md
    code-of-conduct: https://github.com/Ziqi/starcouncil/blob/main/CODE_OF_CONDUCT.md
  release:
    automated-pipeline: true
    attestations:
      - name: GitHub Artifact Attestations (Sigstore / SLSA Build Level 3)
        predicate-uri: https://slsa.dev/provenance/v1
        location: https://github.com/Ziqi/starcouncil/attestations
        comment: Keyless GitHub OIDC build provenance and SPDX-2.3 SBOM attestations via actions/attest-build-provenance and actions/attest-sbom.
    sbom:
      - sbom-file: https://github.com/Ziqi/starcouncil/releases/latest
        format: SPDX
        comment: Automated ISO/IEC 5962 SPDX-2.3 JSON SBOM generated by scripts/generate-sbom.py.
