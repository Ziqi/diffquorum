name: DiffQuorum CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  verify:
    name: Stdlib Tests, Coverage (>=90%), Fuzzing & Sanitize Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run zero-dependency unittest suite
        run: python3 -W error -m unittest discover -s tests -v

      - name: Enforce >=90% statement coverage gate
        run: python3 -W error tests/test_coverage_gate.py --min-coverage 90.0

      - name: Run 2,000-iteration security-invariant fuzzing harness
        run: python3 -W error tests/fuzz_diffquorum.py --iterations 2000

      - name: Enforce clean-room zero-leak sanitize-lint
        run: python3 -W error scripts/diffquorum.py sanitize-lint --target .

      - name: Verify bit-for-bit reproducible source archive & SPDX-2.3 SBOM
        run: |
          python3 -W error scripts/diffquorum.py archive --prefix diffquorum-ci --output /tmp/diffquorum-ci.tar.gz --verify
          python3 -W error scripts/generate-sbom.py --version ci --output /tmp/diffquorum-ci.spdx.json

      - name: Smoke test 30-second init, preflight, doctor & quorum workflow
        run: |
          python3 -W error scripts/diffquorum.py init --root /tmp/dq-ci-demo --force
          python3 -W error scripts/diffquorum.py preflight --root /tmp/dq-ci-demo --write-path /tmp/dq-ci-demo
          python3 -W error scripts/diffquorum.py doctor --root /tmp/dq-ci-demo
          python3 -W error scripts/diffquorum.py quorum --root /tmp/dq-ci-demo --topic "Verify CI smoke test"
